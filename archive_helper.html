<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Archive Helper</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a18;margin:0;padding:24px}.card{max-width:680px;margin:0 auto;background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px}h1{font-size:20px;margin:0 0 8px}p{color:#666;font-size:14px;line-height:1.6}label{display:block;font-size:12px;color:#666;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #ccc;border-radius:8px;font-size:14px}button{cursor:pointer;padding:8px 12px;border:1px solid #bbb;border-radius:8px;background:#fff;font-size:13px}.primary{background:#1a1a18;color:#fff;border-color:#1a1a18}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.step{margin-top:20px;padding-top:16px;border-top:1px solid #eee}.note{font-size:12px;background:#f5f5f3;padding:10px;border-radius:8px;color:#666}.ok{color:#2e7d32}
</style>
</head>
<body>
<div class="card">
<h1>X archive.md 保存ヘルパー</h1>
<p>GitHub Actions から archive.md への保存はレート制限されるため、通常のブラウザで保存します。このページは X URL のコピー、archive.md の起動、はてなブックマーク追加画面への移動を補助します。</p>

<div class="step">
<strong>1. X アカウントURLを用意</strong>
<label for="account">Xアカウント名（@なし）</label>
<input id="account" placeholder="例: tawakenai_marou" autocomplete="off">
<label for="xurl">保存対象URL</label>
<input id="xurl" readonly>
<div class="row">
<button onclick="copyXUrl()">X URLをコピー</button>
<button class="primary" onclick="openArchive()">archive.mdを開く</button>
</div>
<p class="note">archive.md の画面で、コピーした X URL を貼り付けて保存してください。自動POSTは行いません。</p>
</div>

<div class="step">
<strong>2. 保存後のarchive.md URLを登録</strong>
<label for="archiveUrl">保存されたarchive.md URL</label>
<input id="archiveUrl" placeholder="https://archive.md/...">
<div class="row">
<button onclick="copyArchiveUrl()">archive URLをコピー</button>
<button class="primary" onclick="openHatena()">はてブ追加画面を開く</button>
</div>
<p id="status" class="note">archive.md の保存結果URLを貼ると、はてなブックマーク追加画面を開けます。</p>
</div>

<div class="step">
<a href="index.html">作者トラッカーへ戻る</a>
</div>
</div>
<script>
const account = document.getElementById('account');
const xurl = document.getElementById('xurl');
const archiveUrl = document.getElementById('archiveUrl');
const statusEl = document.getElementById('status');

function cleanAccount(v){return String(v||'').trim().replace(/^@/,'');}
function updateXUrl(){const a=cleanAccount(account.value); xurl.value=a ? `https://x.com/${encodeURIComponent(a)}` : '';}
account.addEventListener('input', updateXUrl);

const params = new URLSearchParams(location.search);
if(params.get('x')){account.value=cleanAccount(params.get('x')); updateXUrl();}
if(params.get('archive')){archiveUrl.value=params.get('archive');}

async function copyText(text){
  if(!text) return false;
  try{await navigator.clipboard.writeText(text); return true;}catch(e){
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok;
  }
}
async function copyXUrl(){updateXUrl(); const ok=await copyText(xurl.value); statusEl.textContent=ok?'X URLをコピーしました。archive.md に貼り付けてください。':'コピーできませんでした。';}
function openArchive(){updateXUrl(); if(!xurl.value){alert('Xアカウント名を入力してください');return;} window.open('https://archive.md/','_blank','noopener'); copyXUrl();}
async function copyArchiveUrl(){const ok=await copyText(archiveUrl.value.trim()); statusEl.textContent=ok?'archive URLをコピーしました。':'コピーできませんでした。';}
function validArchiveUrl(v){try{const u=new URL(v); return u.protocol==='https:' && ['archive.md','archive.ph','archive.is','archive.today'].includes(u.hostname);}catch(e){return false;}}
function openHatena(){const u=archiveUrl.value.trim(); if(!validArchiveUrl(u)){alert('有効な archive.md 系URLを入力してください');return;} const h='https://b.hatena.ne.jp/add?'+new URLSearchParams({mode:'confirm',url:u}).toString(); window.open(h,'_blank','noopener'); statusEl.textContent='はてなブックマーク追加画面を開きました。'; statusEl.classList.add('ok');}
</script>
</body>
</html>
