name: Test Threads profile fetch

on:
  push:
    branches:
      - 'feature/threads-profile-support'
  pull_request:
    paths:
      - 'scripts/fetch_threads.py'
      - 'tests/test_fetch_threads.py'
      - 'index.html'
      - '.github/workflows/test_threads.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Threads profile tests
        run: python -m unittest -v tests.test_fetch_threads
