name: Fetch All X Profiles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "更新モード"
        required: true
        default: "missing_only"
        type: choice
        options:
          - missing_only
          - all

jobs:
  fetch-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch profiles
        env:
          FETCH_MODE: ${{ inputs.mode }}
          FETCH_DELAY_SECONDS: "3"
        run: python scripts/fetch_all_profiles.py

      - name: Commit updated artists.json
        env:
          FETCH_MODE: ${{ inputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/artists.json
          git diff --cached --quiet || git commit -m "chore: bulk update X profiles [$FETCH_MODE]"
          git push
