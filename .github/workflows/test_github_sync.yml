name: Test GitHub sync

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/test_github_sync_source.py'
      - '.github/workflows/test_github_sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run GitHub sync tests
        run: python -m pytest -q tests/test_github_sync_source.py
