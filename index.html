<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xアカウントトラッカー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}.app{max-width:900px;margin:0 auto;padding:1.5rem 1rem}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}.header h1{font-size:20px;font-weight:600}.header-actions{display:flex;gap:.5rem;align-items:center}.config-bar{background:#fff;border:.5px solid rgba(0,0,0,.12);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem;display:none}.config-bar h2{font-size:12px;font-weight:600;color:#888;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.05em}.config-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}.config-grid input,.config-path{width:100%;padding:7px 10px;border:.5px solid rgba(0,0,0,.2);border-radius:8px;font-size:13px;background:#fafaf8;color:#1a1a18}.config-save{margin-top:.75rem;display:flex;gap:.5rem;align-items:center}.config-status{font-size:12px;color:#999}.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.25rem}.stat-card{background:#fff;border-radius:8px;padding:.875rem 1rem;border:.5px solid rgba(0,0,0,.08)}.stat-card .label{font-size:12px;color:#999;margin-bottom:4px}.stat-card .value{font-size:22px;font-weight:600}.search-add-row{display:flex;gap:.75rem;margin-bottom:1rem}.search-input{flex:1;padding:8px 12px;border:.5px solid rgba(0,0,0,.2);border-radius:8px;font-size:14px;background:#fff}.search-input:focus,.modal-field input:focus,.modal-field select:focus{outline:none;border-color:#378add}button{cursor:pointer;font-family:inherit;font-size:13px;padding:7px 14px;border-radius:8px;border:.5px solid rgba(0,0,0,.2);background:transparent;color:#1a1a18}button:hover{background:#f0f0ee}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:default;transform:none}button.primary{background:#1a1a18;color:#fff;border-color:transparent}button.primary:hover{background:#1a1a18;opacity:.85}button.danger{color:#a32d2d;border-color:#f09595}button.small{padding:4px 10px;font-size:12px}button.icon-btn{padding:6px 8px;font-size:16px}.artist-list{display:flex;flex-direction:column;gap:.75rem}.artist-card{background:#fff;border:.5px solid rgba(0,0,0,.12);border-radius:12px;overflow:hidden}.artist-header{display:flex;align-items:center;gap:12px;padding:1rem 1.25rem;cursor:pointer;user-select:none}.artist-header:hover{background:#fafaf8}.artist-avatar{width:44px;height:44px;border-radius:50%;background:#e6f1fb;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#185fa5;flex-shrink:0;overflow:hidden}.artist-avatar img{width:100%;height:100%;object-fit:cover}.avatar-pending{background:#f0f0ee;color:#bbb}.artist-info{flex:1;min-width:0}.artist-name{font-weight:600;font-size:15px}.artist-accounts{display:flex;gap:.4rem;margin-top:4px;flex-wrap:wrap}.account-tag,.mode-tag,.status-tag{font-size:11px;padding:2px 8px;border-radius:100px;border:.5px solid rgba(0,0,0,.1);white-space:nowrap}.account-tag{background:#f5f5f3;color:#666}.mode-tag.monitor{background:#e6f1fb;color:#185fa5}.mode-tag.record{background:#fff3e6;color:#9a4d00}.status-tag.active{background:#e8f5e9;color:#2e7d32}.status-tag.unavailable{background:#fcebeb;color:#a32d2d}.status-tag.pending{background:#fff8e1;color:#9a6700}.status-tag.error{background:#fcebeb;color:#a32d2d}.artist-meta{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;justify-content:flex-end}.chevron{font-size:12px;color:#aaa;transition:transform .15s}.chevron.open{transform:rotate(180deg)}.artist-body{border-top:.5px solid rgba(0,0,0,.1);padding:1rem 1.25rem;display:none}.artist-body.open{display:block}.record-box{background:#fff8ef;border:1px solid #f0d8ba;border-radius:8px;padding:10px;margin-bottom:.75rem}.record-box p{font-size:12px;color:#75522b;margin-bottom:8px;line-height:1.5}.row{display:flex;gap:.5rem;flex-wrap:wrap}.note-row{margin-bottom:.75rem}.note-row input{width:100%;padding:6px 10px;border:.5px solid rgba(0,0,0,.1);border-radius:8px;font-size:13px;background:transparent}.add-work-row{display:flex;gap:.5rem;margin-bottom:.75rem}.add-work-row input{flex:1;padding:7px 10px;border:.5px solid rgba(0,0,0,.1);border-radius:8px;font-size:13px;background:#fafaf8}.memo-input-inline{max-width:140px}.works-list{display:flex;flex-direction:column;gap:4px}.work-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:#fafaf8}.work-type-badge{font-size:10px;padding:2px 6px;border-radius:100px;flex-shrink:0;font-weight:600;background:#eee}.work-url{flex:1;color:#185fa5;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.work-memo,.work-date{font-size:11px;color:#999;white-space:nowrap}.artist-actions{display:flex;gap:.5rem;margin-top:.75rem;padding-top:.75rem;border-top:.5px solid rgba(0,0,0,.08);flex-wrap:wrap}.refetch-btn{margin-left:auto}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}.modal{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:480px;border:.5px solid rgba(0,0,0,.12)}.modal h2{font-size:17px;margin-bottom:.5rem}.modal-hint{font-size:12px;color:#888;margin-bottom:1rem;line-height:1.5}.modal-field{margin-bottom:.875rem}.modal-field label{display:block;font-size:12px;color:#666;margin-bottom:4px}.modal-field input,.modal-field select{width:100%;padding:8px 10px;border:.5px solid rgba(0,0,0,.2);border-radius:8px;font-size:14px;color:#1a1a18;background:#fafaf8}.modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.25rem}.empty-state{text-align:center;padding:3rem 1rem;color:#aaa}.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1a1a18;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:200;max-width:320px}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:600px){.config-grid{grid-template-columns:1fr}.stats-row{grid-template-columns:1fr 1fr}.search-add-row{flex-direction:column}.artist-header{align-items:flex-start}.artist-meta{max-width:180px}.add-work-row{flex-direction:column}.memo-input-inline{max-width:none}}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>Xアカウントトラッカー</h1><div class="header-actions"><button onclick="openConfig()" class="icon-btn" title="設定">⚙</button><button onclick="syncToGitHub()" id="syncBtn">GitHubに保存</button><button onclick="loadFromGitHub()" id="loadBtn">GitHubから読込</button></div></div>
<div class="config-bar" id="configBar"><h2>GitHub設定</h2><div class="config-grid"><input id="cfgToken" type="password" placeholder="Personal Access Token"><input id="cfgOwner" type="text" placeholder="owner（ユーザー名）"><input id="cfgRepo" type="text" placeholder="リポジトリ名"></div><div class="config-save"><input id="cfgPath" class="config-path" type="text" placeholder="data/artists.json" style="flex:1"><button onclick="saveConfig()" class="primary">保存</button><span class="config-status" id="configStatus"></span></div></div>
<div class="stats-row"><div class="stat-card"><div class="label">登録アカウント</div><div class="value" id="statAccounts">0</div></div><div class="stat-card"><div class="label">記録対象</div><div class="value" id="statRecord">0</div></div><div class="stat-card"><div class="label">X 公開中</div><div class="value" id="statActive">0</div></div></div>
<div class="search-add-row"><input type="text" class="search-input" id="searchInput" placeholder="名前・Xアカウントで検索..." oninput="renderList()"><button onclick="openAddModal()" class="primary">＋ アカウントを追加</button></div>
<div class="artist-list" id="artistList"></div>
</div>
<div class="modal-backdrop" id="addModal" style="display:none" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalTitle">アカウントを追加</h2><p class="modal-hint">「監視のみ」は死活監視だけを行います。「記録対象」は死活監視に加え、ブラウザから archive.md 保存とはてなブックマーク登録を行うための導線を表示します。</p><div class="modal-field"><label>Xアカウント（@なしでもOK）</label><input id="fX" placeholder="例: example_user"></div><div class="modal-field"><label>表示名（仮）</label><input id="fName" placeholder="空欄ならXアカウント名を使用"></div><div class="modal-field"><label>監視種別</label><select id="fMode"><option value="monitor_only">監視のみ</option><option value="record">記録対象（archive.md + はてブ）</option></select></div><div class="modal-field"><label>Pixivユーザー名またはID（任意）</label><input id="fPixiv" placeholder="任意"></div><div class="modal-field"><label>メモ</label><input id="fNote" placeholder="分類理由やメモなど"></div><div class="modal-actions"><button onclick="closeModal()">キャンセル</button><button onclick="saveArtist()" class="primary" id="modalSaveBtn">追加してプロフィール取得</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
let artists=[];let editingId=null;const STORAGE_KEY='artist_tracker_v1',CONFIG_KEY='artist_tracker_config';
function normalizeArtist(a){if(!a.tracking_mode)a.tracking_mode='monitor_only';if(!Array.isArray(a.works))a.works=[];return a}
function loadLocal(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)artists=JSON.parse(r).map(normalizeArtist)}catch(e){}try{const c=JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}');if(c.token)cfgToken.value=c.token;if(c.owner)cfgOwner.value=c.owner;if(c.repo)cfgRepo.value=c.repo;if(c.path)cfgPath.value=c.path}catch(e){}}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(artists))}
function getConfig(){return{token:cfgToken.value.trim(),owner:cfgOwner.value.trim(),repo:cfgRepo.value.trim(),path:cfgPath.value.trim()||'data/artists.json'}}
function saveConfig(){localStorage.setItem(CONFIG_KEY,JSON.stringify(getConfig()));configStatus.textContent='保存しました';setTimeout(()=>configStatus.textContent='',2000)}
function openConfig(){configBar.style.display=configBar.style.display==='none'?'block':'none'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function today(){return new Date().toISOString().slice(0,10)}function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function detectUrlType(url){if(!url)return'other';if(url.includes('x.com')||url.includes('twitter.com'))return'x_post';if(url.includes('pixiv.net'))return'pixiv';return'other'}function typeLabel(t){return t==='x_post'?'X':t==='pixiv'?'Pixiv':'URL'}
async function triggerFetch(artistId,xAccount){const cfg=getConfig();if(!cfg.token||!cfg.owner||!cfg.repo)return false;const res=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/dispatches`,{method:'POST',headers:{Authorization:`token ${cfg.token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({event_type:'fetch_artist',client_payload:{artist_id:artistId,x_account:xAccount}})});return res.status===204}
async function getFileSha(apiUrl,token){try{const r=await fetch(apiUrl,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'}});if(r.ok)return(await r.json()).sha}catch(e){}return null}
async function syncToGitHub(){const cfg=getConfig();if(!cfg.token||!cfg.owner||!cfg.repo){openConfig();showToast('まずGitHub設定を入力してください');return false}syncBtn.textContent='保存中...';syncBtn.disabled=true;try{const apiUrl=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`,sha=await getFileSha(apiUrl,cfg.token),content=btoa(unescape(encodeURIComponent(JSON.stringify({artists},null,2)))),body={message:`chore: update artists.json [${today()}]`,content};if(sha)body.sha=sha;const res=await fetch(apiUrl,{method:'PUT',headers:{Authorization:`token ${cfg.token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});showToast(res.ok?'GitHubに保存しました':'エラー: '+res.status);return res.ok}catch(e){showToast('エラー: '+e.message);return false}finally{syncBtn.textContent='GitHubに保存';syncBtn.disabled=false}}
async function loadFromGitHub(){const cfg=getConfig();if(!cfg.token||!cfg.owner||!cfg.repo){openConfig();showToast('まずGitHub設定を入力してください');return}loadBtn.textContent='読込中...';loadBtn.disabled=true;try{const apiUrl=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`,res=await fetch(apiUrl,{headers:{Authorization:`token ${cfg.token}`,Accept:'application/vnd.github.v3+json'}});if(!res.ok){showToast('ファイルが見つかりません');return}const d=await res.json(),json=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,'')))));if(json.artists){artists=json.artists.map(normalizeArtist);saveLocal();renderList();showToast('読み込みました')}}catch(e){showToast('エラー: '+e.message)}finally{loadBtn.textContent='GitHubから読込';loadBtn.disabled=false}}
function openAddModal(){editingId=null;modalTitle.textContent='アカウントを追加';modalSaveBtn.textContent='追加してプロフィール取得';fX.value='';fName.value='';fPixiv.value='';fNote.value='';fMode.value='monitor_only';addModal.style.display='flex';setTimeout(()=>fX.focus(),50)}
function openEditModal(id){const a=artists.find(x=>x.id===id);if(!a)return;editingId=id;modalTitle.textContent='アカウントを編集';modalSaveBtn.textContent='更新してプロフィール再取得';fX.value=a.x_account||'';fName.value=a.name||'';fPixiv.value=a.pixiv_user||'';fNote.value=a.note||'';fMode.value=a.tracking_mode||'monitor_only';addModal.style.display='flex'}
function closeModal(){addModal.style.display='none';editingId=null}
async function saveArtist(){const xAccount=fX.value.trim().replace(/^@/,''),pixivUser=fPixiv.value.trim(),name=fName.value.trim()||xAccount||pixivUser||'（未設定）',note=fNote.value.trim(),trackingMode=fMode.value;if(!xAccount&&!pixivUser){alert('XアカウントかPixivユーザーを入力してください');return}modalSaveBtn.disabled=true;modalSaveBtn.textContent='処理中...';let a;if(editingId){a=artists.find(x=>x.id===editingId);if(a)Object.assign(a,{name,x_account:xAccount,pixiv_user:pixivUser,note,tracking_mode:trackingMode,fetch_status:xAccount?'pending':a.fetch_status})}else{a={id:uid(),name,x_account:xAccount,pixiv_user:pixivUser,note,tracking_mode:trackingMode,works:[],added_at:today(),fetch_status:xAccount?'pending':'none'};artists.push(a)}saveLocal();closeModal();renderList();if(xAccount){showToast('GitHubへ保存中...');const synced=await syncToGitHub();if(!synced){a.fetch_status='error';saveLocal();renderList();modalSaveBtn.disabled=false;return}const ok=await triggerFetch(a.id,xAccount);if(ok)showToast('プロフィール取得を依頼しました。数分後にGitHubから読込してください。');else{a.fetch_status='error';saveLocal();renderList();showToast('プロフィール取得の開始に失敗しました')}}modalSaveBtn.disabled=false}
function addWorkInline(id){const urlEl=document.getElementById('wInline_'+id),memoEl=document.getElementById('wMemoInline_'+id),url=urlEl?urlEl.value.trim():'';if(!url)return;const a=artists.find(x=>x.id===id);if(!a)return;a.works=a.works||[];a.works.push({url,type:detectUrlType(url),memo:memoEl?memoEl.value.trim():'',saved_at:today()});saveLocal();renderList();setTimeout(()=>{const b=document.getElementById('body_'+id);if(b&&!b.classList.contains('open'))toggleCard(id)},30);showToast('URLを追加しました')}
function removeWork(id,idx){const a=artists.find(x=>x.id===id);if(!a)return;a.works.splice(idx,1);saveLocal();renderList()}function removeArtist(id){if(!confirm('このアカウントを削除しますか？'))return;artists=artists.filter(a=>a.id!==id);saveLocal();renderList();showToast('削除しました')}function updateNote(id,val){const a=artists.find(x=>x.id===id);if(a){a.note=val;saveLocal()}}
function toggleCard(id){const body=document.getElementById('body_'+id),chev=document.getElementById('chev_'+id);if(!body)return;body.classList.toggle('open');if(chev)chev.classList.toggle('open')}
function initials(name){return String(name||'??').slice(0,2)}function avatarHTML(a){if(a.avatar_url)return`<img src="${esc(a.avatar_url)}" alt="" onerror="this.parentNode.innerHTML='${esc(initials(a.name))}'">`;if(a.fetch_status==='pending')return'…';return initials(a.name)}
function fetchBadge(a){if(!a.x_account)return'';if(a.fetch_status==='pending')return'<span class="status-tag pending">取得待ち</span>';if(a.fetch_status==='error')return'<span class="status-tag error">取得失敗</span>';return''}
function monitorBadge(a){const s=a.monitoring&&a.monitoring.status;if(s==='active')return'<span class="status-tag active">X 公開中</span>';if(s==='unavailable')return'<span class="status-tag unavailable">X 利用不可</span>';return''}
function modeBadge(a){return a.tracking_mode==='record'?'<span class="mode-tag record">記録対象</span>':'<span class="mode-tag monitor">監視のみ</span>'}
function archiveHelperUrl(a){return`archive_helper.html?x=${encodeURIComponent(a.x_account||'')}`}
function updateStats(){statAccounts.textContent=artists.length;statRecord.textContent=artists.filter(a=>a.tracking_mode==='record').length;statActive.textContent=artists.filter(a=>a.monitoring&&a.monitoring.status==='active').length}
function renderList(){const q=searchInput.value.toLowerCase(),list=artistList,filtered=artists.filter(a=>!q||(a.name||'').toLowerCase().includes(q)||(a.x_account||'').toLowerCase().includes(q)||(a.note||'').toLowerCase().includes(q));if(!filtered.length){list.innerHTML=`<div class="empty-state">${q?'検索結果がありません':'アカウントがまだ登録されていません'}</div>`;updateStats();return}list.innerHTML=filtered.map(a=>{const works=a.works||[],record=a.tracking_mode==='record'&&a.x_account;return`<div class="artist-card"><div class="artist-header" onclick="toggleCard('${esc(a.id)}')"><div class="artist-avatar${a.fetch_status==='pending'&&!a.avatar_url?' avatar-pending':''}">${avatarHTML(a)}</div><div class="artist-info"><div class="artist-name">${esc(a.name)}</div><div class="artist-accounts">${a.x_account?`<span class="account-tag">@${esc(a.x_account)}</span>`:''}${a.pixiv_user?`<span class="account-tag">pixiv: ${esc(a.pixiv_user)}</span>`:''}${modeBadge(a)}</div></div><div class="artist-meta">${fetchBadge(a)}${monitorBadge(a)}<span class="chevron" id="chev_${esc(a.id)}">▾</span></div></div><div class="artist-body" id="body_${esc(a.id)}">${record?`<div class="record-box"><p>このアカウントは「記録対象」です。archive.mdは通常プロフィールが既定値で、必要な場合だけリプライ欄へ切り替えられます。はてブは通常プロフィールを対象にします。</p><div class="row"><a href="${archiveHelperUrl(a)}"><button class="small primary">アーカイブ・はてブ</button></a><a href="https://x.com/${encodeURIComponent(a.x_account)}" target="_blank" rel="noopener"><button class="small">Xプロフィールを開く</button></a></div></div>`:''}${a.archive&&a.archive.url?`<div class="row" style="margin-bottom:.75rem"><a href="${esc(a.archive.url)}" target="_blank" rel="noopener"><button class="small">保存済みarchiveを見る</button></a></div>`:''}<div class="note-row"><input type="text" placeholder="メモ..." value="${esc(a.note||'')}" onchange="updateNote('${esc(a.id)}',this.value)"></div><div class="add-work-row"><input id="wInline_${esc(a.id)}" placeholder="関連URLを貼り付け" onkeydown="if(event.key==='Enter')addWorkInline('${esc(a.id)}')"><input class="memo-input-inline" id="wMemoInline_${esc(a.id)}" placeholder="メモ"><button class="small" onclick="addWorkInline('${esc(a.id)}')">追加</button></div><div class="works-list">${works.map((w,i)=>`<div class="work-item"><span class="work-type-badge">${typeLabel(w.type)}</span><a class="work-url" href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.url)}</a>${w.memo?`<span class="work-memo">${esc(w.memo)}</span>`:''}<span class="work-date">${esc(w.saved_at||'')}</span><button class="small danger" onclick="removeWork('${esc(a.id)}',${i})">×</button></div>`).join('')}</div><div class="artist-actions"><button class="small" onclick="openEditModal('${esc(a.id)}')">編集</button><button class="small danger" onclick="removeArtist('${esc(a.id)}')">削除</button>${a.x_account?`<button class="small refetch-btn" onclick="refetchProfile('${esc(a.id)}')">プロフィール再取得</button>`:''}</div></div></div>`}).join('');updateStats()}
async function refetchProfile(id){const a=artists.find(x=>x.id===id);if(!a||!a.x_account)return;a.fetch_status='pending';saveLocal();renderList();const ok=await triggerFetch(a.id,a.x_account);showToast(ok?'再取得を依頼しました':'トリガーに失敗しました')}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000)}
loadLocal();renderList();
</script>
</body>
</html>
