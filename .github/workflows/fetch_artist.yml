name: Fetch Artist Profile

on:
  repository_dispatch:
    types: [fetch_artist]
  workflow_dispatch:
    inputs:
      artist_id:
        description: "Artist ID in data/artists.json"
        required: true
        type: string
      x_account:
        description: "X account name without @"
        required: true
        type: string

concurrency:
  group: x-archives-data-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch, diagnose, commit, and push artist profile
        env:
          ARTIST_ID: ${{ github.event.client_payload.artist_id || inputs.artist_id }}
          X_ACCOUNT: ${{ github.event.client_payload.x_account || inputs.x_account }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Attempt $attempt: sync with latest main"
            git fetch origin main
            git reset --hard origin/main

            python scripts/fetch_artist.py
            python scripts/profile_fetch_diagnostics.py

            git add data/artists.json
            if git diff --cached --quiet; then
              echo "No artist profile changes to commit."
              exit 0
            fi

            git commit -m "chore: update artist profile [$X_ACCOUNT]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another update; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "Failed to push artist profile after 3 attempts."
          exit 1
