name: Monitor X accounts

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: monitor-x-accounts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check X accounts
        # archive.md returns HTTP 429 from GitHub-hosted runners.
        # Archiving is intentionally handled from the user's browser instead.
        run: python scripts/monitor_accounts.py --no-archive
      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artists.json
          git diff --cached --quiet || git commit -m "chore: record X account checks"
          git push
