name: Test Threads profile fetch

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'scripts/fetch_threads.py'
      - 'tests/test_fetch_threads.py'
      - 'index.html'
      - '.github/workflows/test_threads.yml'
  pull_request:
    paths:
      - 'scripts/fetch_threads.py'
      - 'tests/test_fetch_threads.py'
      - 'index.html'
      - '.github/workflows/test_threads.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI test dependency
        run: python -m pip install --upgrade pytest
      - name: Run Threads profile tests
        run: python -m unittest -v tests.test_fetch_threads
      - name: Run existing index tests
        run: python -m pytest -q tests/test_index_tracking_modes.py
      - name: Check index JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].rsplit("</script>", 1)[0]
          Path("/tmp/x-archives-index.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/x-archives-index.js
      - name: Probe @f00744 through public Threads HTML
        env:
          ARTIST_ID: threads-f00744
          THREADS_ACCOUNT: f00744
          THREADS_ACCESS_TOKEN: ""
        run: |
          python scripts/fetch_threads.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/artists.json").read_text(encoding="utf-8"))
          artist = next(a for a in data["artists"] if a.get("id") == "threads-f00744")
          print("threads_fetch_status=" + str(artist.get("threads_fetch_status")))
          print("threads_profile_source=" + str(artist.get("threads_profile_source")))
          print("threads_name=" + str(artist.get("threads_name")))
          print("threads_posts_count=" + str(len(artist.get("threads_posts") or [])))
          print("threads_bio_present=" + str(bool(artist.get("threads_bio"))))
          PY

# live probe retry after data fix
