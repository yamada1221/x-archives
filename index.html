<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xアカウントトラッカー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f3; color: #1a1a18; min-height: 100vh; }
  .app { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header-actions { display: flex; gap: 0.5rem; align-items: center; }

  .config-bar { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: none; }
  .config-bar h2 { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .config-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
  .config-grid input, .config-path { width: 100%; padding: 7px 10px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; font-size: 13px; background: #fafaf8; color: #1a1a18; }
  .config-grid input:focus, .config-path:focus { outline: none; border-color: #378add; }
  .config-save { margin-top: 0.75rem; display: flex; gap: 0.5rem; align-items: center; }
  .config-status { font-size: 12px; color: #999; }

  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
  .stat-card { background: #fff; border-radius: 8px; padding: 0.875rem 1rem; border: 0.5px solid rgba(0,0,0,0.08); }
  .stat-card .label { font-size: 12px; color: #999; margin-bottom: 4px; }
  .stat-card .value { font-size: 22px; font-weight: 600; }

  .search-add-row { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
  .search-input { flex: 1; padding: 8px 12px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; font-size: 14px; background: #fff; color: #1a1a18; }
  .search-input:focus { outline: none; border-color: #378add; }

  button { cursor: pointer; font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.2); background: transparent; color: #1a1a18; }
  button:hover { background: #f0f0ee; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }
  button.primary { background: #1a1a18; color: #fff; border-color: transparent; }
  button.primary:hover { opacity: 0.85; background: #1a1a18; }
  button.danger { color: #a32d2d; border-color: #f09595; }
  button.danger:hover { background: #fcebeb; }
  button.small { padding: 4px 10px; font-size: 12px; }
  button.icon-btn { padding: 6px 8px; font-size: 16px; }

  .artist-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .artist-card { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; overflow: hidden; }
  .artist-header { display: flex; align-items: center; gap: 12px; padding: 1rem 1.25rem; cursor: pointer; user-select: none; }
  .artist-header:hover { background: #fafaf8; }

  .artist-avatar { width: 44px; height: 44px; border-radius: 50%; background: #e6f1fb; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; color: #185fa5; flex-shrink: 0; overflow: hidden; }
  .artist-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-pending { background: #f0f0ee; color: #bbb; }

  .artist-info { flex: 1; min-width: 0; }
  .artist-name { font-weight: 600; font-size: 15px; }
  .artist-accounts { display: flex; gap: 0.4rem; margin-top: 4px; flex-wrap: wrap; }
  .account-tag, .mode-tag, .status-tag { font-size: 11px; padding: 2px 8px; border-radius: 100px; border: 0.5px solid rgba(0,0,0,0.1); white-space: nowrap; }
  .account-tag { background: #f5f5f3; color: #666; }
  .mode-tag.monitor { background: #e6f1fb; color: #185fa5; }
  .mode-tag.record { background: #fff3e6; color: #9a4d00; }
  .status-tag.active { background: #e8f5e9; color: #2e7d32; }
  .status-tag.unavailable, .status-tag.error { background: #fcebeb; color: #a32d2d; }
  .status-tag.pending { background: #fff8e1; color: #9a6700; }
  .status-tag.archive-missing { background: #f5f5f3; color: #666; }
  .status-tag.archive-done { background: #e8f5e9; color: #2e7d32; }

  .artist-meta { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; justify-content: flex-end; }
  .chevron { font-size: 12px; color: #aaa; transition: transform 0.15s; }
  .chevron.open { transform: rotate(180deg); }

  .artist-body { border-top: 0.5px solid rgba(0,0,0,0.1); padding: 1rem 1.25rem; display: none; }
  .artist-body.open { display: block; }
  .record-box { background: #fff8ef; border: 1px solid #f0d8ba; border-radius: 8px; padding: 10px; margin-bottom: 0.75rem; }
  .record-box p { font-size: 12px; color: #75522b; margin-bottom: 8px; line-height: 1.5; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .note-row { margin-bottom: 0.75rem; }
  .note-row input { width: 100%; padding: 6px 10px; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 13px; background: transparent; }

  .add-work-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
  .add-work-row input { flex: 1; padding: 7px 10px; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 8px; font-size: 13px; background: #fafaf8; }
  .memo-input-inline { max-width: 140px; }

  .works-list { display: flex; flex-direction: column; gap: 4px; }
  .work-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: #fafaf8; }
  .work-type-badge { font-size: 10px; padding: 2px 6px; border-radius: 100px; flex-shrink: 0; font-weight: 600; background: #eee; }
  .work-url { flex: 1; color: #185fa5; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .work-memo, .work-date { font-size: 11px; color: #999; white-space: nowrap; }

  .artist-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 0.5px solid rgba(0,0,0,0.08); flex-wrap: wrap; }
  .refetch-btn { margin-left: auto; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
  .modal { background: #fff; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 480px; border: 0.5px solid rgba(0,0,0,0.12); }
  .modal h2 { font-size: 17px; margin-bottom: 0.5rem; }
  .modal-hint { font-size: 12px; color: #888; margin-bottom: 1rem; line-height: 1.5; }
  .modal-field { margin-bottom: 0.875rem; }
  .modal-field label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
  .modal-field input, .modal-field select { width: 100%; padding: 8px 10px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; font-size: 14px; color: #1a1a18; background: #fafaf8; }
  .modal-field input:focus, .modal-field select:focus { outline: none; border-color: #378add; }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.25rem; }

  .empty-state { text-align: center; padding: 3rem 1rem; color: #aaa; }
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1a1a18; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 200; max-width: 320px; }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    .config-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .search-add-row { flex-direction: column; }
    .artist-header { align-items: flex-start; }
    .artist-meta { max-width: 180px; }
    .add-work-row { flex-direction: column; }
    .memo-input-inline { max-width: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Xアカウントトラッカー</h1>
    <div class="header-actions">
      <button onclick="openConfig()" class="icon-btn" title="設定">⚙</button>
      <button onclick="syncToGitHub()" id="syncBtn">GitHubに保存</button>
      <button onclick="loadFromGitHub()" id="loadBtn">GitHubから読込</button>
    </div>
  </div>

  <div class="config-bar" id="configBar">
    <h2>GitHub設定</h2>
    <div class="config-grid">
      <input id="cfgToken" type="password" placeholder="Personal Access Token">
      <input id="cfgOwner" type="text" placeholder="owner（ユーザー名）">
      <input id="cfgRepo" type="text" placeholder="リポジトリ名">
    </div>
    <div class="config-save">
      <input id="cfgPath" class="config-path" type="text" placeholder="data/artists.json" style="flex:1">
      <button onclick="saveConfig()" class="primary">保存</button>
      <span class="config-status" id="configStatus"></span>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="label">登録アカウント</div><div class="value" id="statAccounts">0</div></div>
    <div class="stat-card"><div class="label">記録対象</div><div class="value" id="statRecord">0</div></div>
    <div class="stat-card"><div class="label">X 公開中</div><div class="value" id="statActive">0</div></div>
  </div>

  <div class="search-add-row">
    <input type="text" class="search-input" id="searchInput" placeholder="名前・Xアカウントで検索..." oninput="renderList()">
    <button onclick="openAddModal()" class="primary">＋ アカウントを追加</button>
  </div>

  <div class="artist-list" id="artistList"></div>
</div>

<div class="modal-backdrop" id="addModal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">アカウントを追加</h2>
    <p class="modal-hint">「監視のみ」は死活監視だけを行います。「記録対象」は死活監視に加え、ブラウザから archive.md 保存とはてなブックマーク登録を行うための導線を表示します。</p>
    <div class="modal-field"><label>Xアカウント（@なしでもOK）</label><input id="fX" placeholder="例: example_user"></div>
    <div class="modal-field"><label>表示名（仮）</label><input id="fName" placeholder="空欄ならXアカウント名を使用"></div>
    <div class="modal-field"><label>監視種別</label><select id="fMode"><option value="monitor_only">監視のみ</option><option value="record">記録対象（archive.md + はてブ）</option></select></div>
    <div class="modal-field"><label>Pixivユーザー名またはID（任意）</label><input id="fPixiv" placeholder="任意"></div>
    <div class="modal-field"><label>メモ</label><input id="fNote" placeholder="分類理由やメモなど"></div>
    <div class="modal-actions"><button onclick="closeModal()">キャンセル</button><button onclick="saveArtist()" class="primary" id="modalSaveBtn">追加してプロフィール取得</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let artists = [];
let editingId = null;

const STORAGE_KEY = 'artist_tracker_v1';
const CONFIG_KEY = 'artist_tracker_config';

function normalizeArtist(artist) {
  if (!artist.tracking_mode) artist.tracking_mode = 'monitor_only';
  if (!Array.isArray(artist.works)) artist.works = [];
  return artist;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) artists = JSON.parse(raw).map(normalizeArtist);
  } catch (e) {}

  try {
    const config = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
    if (config.token) document.getElementById('cfgToken').value = config.token;
    if (config.owner) document.getElementById('cfgOwner').value = config.owner;
    if (config.repo) document.getElementById('cfgRepo').value = config.repo;
    if (config.path) document.getElementById('cfgPath').value = config.path;
  } catch (e) {}
}

function saveLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(artists));
}

function getConfig() {
  return {
    token: document.getElementById('cfgToken').value.trim(),
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    path: document.getElementById('cfgPath').value.trim() || 'data/artists.json',
  };
}

function saveConfig() {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(getConfig()));
  const status = document.getElementById('configStatus');
  status.textContent = '保存しました';
  setTimeout(() => status.textContent = '', 2000);
}

function openConfig() {
  const bar = document.getElementById('configBar');
  bar.style.display = bar.style.display === 'none' ? 'block' : 'none';
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function esc(value) {
  return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function detectUrlType(url) {
  if (!url) return 'other';
  if (url.includes('x.com') || url.includes('twitter.com')) return 'x_post';
  if (url.includes('pixiv.net')) return 'pixiv';
  return 'other';
}

function typeLabel(type) {
  if (type === 'x_post') return 'X';
  if (type === 'pixiv') return 'Pixiv';
  return 'URL';
}

async function triggerFetch(artistId, xAccount) {
  const cfg = getConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) return false;

  const response = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/dispatches`, {
    method: 'POST',
    headers: {
      Authorization: `token ${cfg.token}`,
      Accept: 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ event_type: 'fetch_artist', client_payload: { artist_id: artistId, x_account: xAccount } }),
  });

  return response.status === 204;
}

async function getFileSha(apiUrl, token) {
  try {
    const response = await fetch(apiUrl, { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } });
    if (response.ok) return (await response.json()).sha;
  } catch (e) {}
  return null;
}

async function syncToGitHub() {
  const cfg = getConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) {
    openConfig();
    showToast('まずGitHub設定を入力してください');
    return false;
  }

  const button = document.getElementById('syncBtn');
  button.textContent = '保存中...';
  button.disabled = true;

  try {
    const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const sha = await getFileSha(apiUrl, cfg.token);
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({ artists }, null, 2))));
    const body = { message: `chore: update artists.json [${today()}]`, content };
    if (sha) body.sha = sha;

    const response = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    showToast(response.ok ? 'GitHubに保存しました' : `エラー: ${response.status}`);
    return response.ok;
  } catch (e) {
    showToast(`エラー: ${e.message}`);
    return false;
  } finally {
    button.textContent = 'GitHubに保存';
    button.disabled = false;
  }
}

async function loadFromGitHub() {
  const cfg = getConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) {
    openConfig();
    showToast('まずGitHub設定を入力してください');
    return;
  }

  const button = document.getElementById('loadBtn');
  button.textContent = '読込中...';
  button.disabled = true;

  try {
    const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const response = await fetch(apiUrl, { headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json' } });
    if (!response.ok) {
      showToast('ファイルが見つかりません');
      return;
    }

    const data = await response.json();
    const json = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, '')))));
    if (json.artists) {
      artists = json.artists.map(normalizeArtist);
      saveLocal();
      renderList();
      showToast('読み込みました');
    }
  } catch (e) {
    showToast(`エラー: ${e.message}`);
  } finally {
    button.textContent = 'GitHubから読込';
    button.disabled = false;
  }
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'アカウントを追加';
  document.getElementById('modalSaveBtn').textContent = '追加してプロフィール取得';
  document.getElementById('fX').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fPixiv').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('fMode').value = 'monitor_only';
  document.getElementById('addModal').style.display = 'flex';
  setTimeout(() => document.getElementById('fX').focus(), 50);
}

function openEditModal(id) {
  const artist = artists.find(item => item.id === id);
  if (!artist) return;

  editingId = id;
  document.getElementById('modalTitle').textContent = 'アカウントを編集';
  document.getElementById('modalSaveBtn').textContent = '更新してプロフィール再取得';
  document.getElementById('fX').value = artist.x_account || '';
  document.getElementById('fName').value = artist.name || '';
  document.getElementById('fPixiv').value = artist.pixiv_user || '';
  document.getElementById('fNote').value = artist.note || '';
  document.getElementById('fMode').value = artist.tracking_mode || 'monitor_only';
  document.getElementById('addModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('addModal').style.display = 'none';
  editingId = null;
}

async function saveArtist() {
  const xAccount = document.getElementById('fX').value.trim().replace(/^@/, '');
  const pixivUser = document.getElementById('fPixiv').value.trim();
  const name = document.getElementById('fName').value.trim() || xAccount || pixivUser || '（未設定）';
  const note = document.getElementById('fNote').value.trim();
  const trackingMode = document.getElementById('fMode').value;

  if (!xAccount && !pixivUser) {
    alert('XアカウントかPixivユーザーを入力してください');
    return;
  }

  if (xAccount) {
    const normalizedX = xAccount.toLowerCase();
    const duplicate = artists.find(item =>
      item.id !== editingId &&
      String(item.x_account || '').trim().replace(/^@/, '').toLowerCase() === normalizedX
    );
    if (duplicate) {
      alert(`@${xAccount} はすでに登録されています`);
      return;
    }
  }

  const button = document.getElementById('modalSaveBtn');
  button.disabled = true;
  button.textContent = '処理中...';

  let artist;
  if (editingId) {
    artist = artists.find(item => item.id === editingId);
    if (artist) Object.assign(artist, { name, x_account: xAccount, pixiv_user: pixivUser, note, tracking_mode: trackingMode, fetch_status: xAccount ? 'pending' : artist.fetch_status });
  } else {
    artist = { id: uid(), name, x_account: xAccount, pixiv_user: pixivUser, note, tracking_mode: trackingMode, works: [], added_at: today(), fetch_status: xAccount ? 'pending' : 'none' };
    artists.push(artist);
  }

  saveLocal();
  closeModal();
  renderList();

  if (xAccount) {
    showToast('GitHubへ保存中...');
    const synced = await syncToGitHub();
    if (!synced) {
      artist.fetch_status = 'error';
      saveLocal();
      renderList();
      button.disabled = false;
      return;
    }

    const ok = await triggerFetch(artist.id, xAccount);
    if (ok) {
      showToast('プロフィール取得を依頼しました。数分後にGitHubから読込してください。');
    } else {
      artist.fetch_status = 'error';
      saveLocal();
      renderList();
      showToast('プロフィール取得の開始に失敗しました');
    }
  }

  button.disabled = false;
}

function addWorkInline(id) {
  const urlInput = document.getElementById(`wInline_${id}`);
  const memoInput = document.getElementById(`wMemoInline_${id}`);
  const url = urlInput ? urlInput.value.trim() : '';
  if (!url) return;

  const artist = artists.find(item => item.id === id);
  if (!artist) return;

  artist.works = artist.works || [];
  artist.works.push({ url, type: detectUrlType(url), memo: memoInput ? memoInput.value.trim() : '', saved_at: today() });
  saveLocal();
  renderList();
  setTimeout(() => {
    const body = document.getElementById(`body_${id}`);
    if (body && !body.classList.contains('open')) toggleCard(id);
  }, 30);
  showToast('URLを追加しました');
}

function removeWork(id, index) {
  const artist = artists.find(item => item.id === id);
  if (!artist) return;
  artist.works.splice(index, 1);
  saveLocal();
  renderList();
}

function removeArtist(id) {
  if (!confirm('このアカウントを削除しますか？')) return;
  artists = artists.filter(item => item.id !== id);
  saveLocal();
  renderList();
  showToast('削除しました');
}

function updateNote(id, value) {
  const artist = artists.find(item => item.id === id);
  if (artist) {
    artist.note = value;
    saveLocal();
  }
}

function toggleCard(id) {
  const body = document.getElementById(`body_${id}`);
  const chevron = document.getElementById(`chev_${id}`);
  if (!body) return;
  body.classList.toggle('open');
  if (chevron) chevron.classList.toggle('open');
}

function initials(name) {
  return String(name || '??').slice(0, 2);
}

function avatarHTML(artist) {
  if (artist.avatar_url) return `<img src="${esc(artist.avatar_url)}" alt="" onerror="this.parentNode.innerHTML='${esc(initials(artist.name))}'">`;
  if (artist.fetch_status === 'pending') return '…';
  return initials(artist.name);
}

function fetchBadge(artist) {
  if (!artist.x_account) return '';
  if (artist.fetch_status === 'pending') return '<span class="status-tag pending">取得待ち</span>';
  if (artist.fetch_status === 'error') return '<span class="status-tag error">取得失敗</span>';
  return '';
}

function monitorBadge(artist) {
  const status = artist.monitoring && artist.monitoring.status;
  if (status === 'active') return '<span class="status-tag active">X 公開中</span>';
  if (status === 'unavailable') return '<span class="status-tag unavailable">X 利用不可</span>';
  return '';
}

function modeBadge(artist) {
  return artist.tracking_mode === 'record'
    ? '<span class="mode-tag record">記録対象</span>'
    : '<span class="mode-tag monitor">監視のみ</span>';
}

function archiveHelperUrl(artist) {
  return `archive_helper.html?x=${encodeURIComponent(artist.x_account || '')}`;
}

function archiveBadge(artist) {
  if (artist.tracking_mode !== 'record') return '';
  if (artist.archive_status === 'done' && artist.archive_url) return '<span class="status-tag archive-done">保存済み</span>';
  if (artist.archive_status === 'pending') return '<span class="status-tag pending">処理中</span>';
  return '<span class="status-tag archive-missing">未保存</span>';
}

function updateStats() {
  document.getElementById('statAccounts').textContent = artists.length;
  document.getElementById('statRecord').textContent = artists.filter(item => item.tracking_mode === 'record').length;
  document.getElementById('statActive').textContent = artists.filter(item => item.monitoring && item.monitoring.status === 'active').length;
}

function renderList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const list = document.getElementById('artistList');
  const filtered = artists.filter(artist =>
    !query ||
    (artist.name || '').toLowerCase().includes(query) ||
    (artist.x_account || '').toLowerCase().includes(query) ||
    (artist.note || '').toLowerCase().includes(query)
  );

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state">${query ? '検索結果がありません' : 'アカウントがまだ登録されていません'}</div>`;
    updateStats();
    return;
  }

  list.innerHTML = filtered.map(artist => {
    const works = artist.works || [];
    const recordTarget = artist.tracking_mode === 'record' && artist.x_account;

    return `
    <div class="artist-card">
      <div class="artist-header" onclick="toggleCard('${esc(artist.id)}')">
        <div class="artist-avatar${artist.fetch_status === 'pending' && !artist.avatar_url ? ' avatar-pending' : ''}">${avatarHTML(artist)}</div>
        <div class="artist-info">
          <div class="artist-name">${esc(artist.name)}</div>
          <div class="artist-accounts">
            ${artist.x_account ? `<span class="account-tag">@${esc(artist.x_account)}</span>` : ''}
            ${artist.pixiv_user ? `<span class="account-tag">pixiv: ${esc(artist.pixiv_user)}</span>` : ''}
            ${modeBadge(artist)}
          </div>
        </div>
        <div class="artist-meta">
          ${fetchBadge(artist)}
          ${monitorBadge(artist)}
          ${archiveBadge(artist)}
          <span class="chevron" id="chev_${esc(artist.id)}">▾</span>
        </div>
      </div>

      <div class="artist-body" id="body_${esc(artist.id)}">
        ${recordTarget ? `
          <div class="record-box">
            <p>このアカウントは「記録対象」です。archive.mdは通常プロフィールが既定値で、必要な場合だけリプライ欄へ切り替えられます。はてブは通常プロフィールを対象にします。</p>
            <div class="row">
              <a href="${archiveHelperUrl(artist)}"><button class="small primary">アーカイブ・はてブ</button></a>
              <a href="https://x.com/${encodeURIComponent(artist.x_account)}" target="_blank" rel="noopener"><button class="small">Xプロフィールを開く</button></a>
            </div>
          </div>` : ''}

        ${artist.archive_status === 'done' && artist.archive_url ? `
          <div class="row" style="margin-bottom:.75rem">
            <a href="${esc(artist.archive_url)}" target="_blank" rel="noopener"><button class="small">保存済みarchiveを見る</button></a>
          </div>` : ''}

        <div class="note-row"><input type="text" placeholder="メモ..." value="${esc(artist.note || '')}" onchange="updateNote('${esc(artist.id)}', this.value)"></div>

        <div class="add-work-row">
          <input id="wInline_${esc(artist.id)}" placeholder="関連URLを貼り付け" onkeydown="if(event.key==='Enter')addWorkInline('${esc(artist.id)}')">
          <input class="memo-input-inline" id="wMemoInline_${esc(artist.id)}" placeholder="メモ">
          <button class="small" onclick="addWorkInline('${esc(artist.id)}')">追加</button>
        </div>

        <div class="works-list">
          ${works.map((work, index) => `
            <div class="work-item">
              <span class="work-type-badge">${typeLabel(work.type)}</span>
              <a class="work-url" href="${esc(work.url)}" target="_blank" rel="noopener">${esc(work.url)}</a>
              ${work.memo ? `<span class="work-memo">${esc(work.memo)}</span>` : ''}
              <span class="work-date">${esc(work.saved_at || '')}</span>
              <button class="small danger" onclick="removeWork('${esc(artist.id)}', ${index})">×</button>
            </div>`).join('')}
        </div>

        <div class="artist-actions">
          <button class="small" onclick="openEditModal('${esc(artist.id)}')">編集</button>
          <button class="small danger" onclick="removeArtist('${esc(artist.id)}')">削除</button>
          ${artist.x_account ? `<button class="small refetch-btn" onclick="refetchProfile('${esc(artist.id)}')">プロフィール再取得</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  updateStats();
}

async function refetchProfile(id) {
  const artist = artists.find(item => item.id === id);
  if (!artist || !artist.x_account) return;

  artist.fetch_status = 'pending';
  saveLocal();
  renderList();

  const ok = await triggerFetch(artist.id, artist.x_account);
  showToast(ok ? '再取得を依頼しました' : 'トリガーに失敗しました');
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

loadLocal();
renderList();
const startupConfig = getConfig();
if (startupConfig.token && startupConfig.owner && startupConfig.repo) {
  loadFromGitHub();
}
</script>
</body>
</html>
