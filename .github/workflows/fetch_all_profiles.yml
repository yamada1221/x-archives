name: Fetch All X Profiles

on:
  push:
    paths:
      - 'data/artists.json'
  workflow_dispatch:
    inputs:
      mode:
        description: "更新モード"
        required: true
        default: "missing_only"
        type: choice
        options:
          - missing_only
          - all

concurrency:
  group: x-archives-data-writes
  cancel-in-progress: false

jobs:
  fetch-all:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch, commit, and push profiles
        env:
          FETCH_MODE: ${{ github.event_name == 'push' && 'missing_only' || inputs.mode }}
          FETCH_DELAY_SECONDS: "3"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Attempt $attempt: sync with latest main"
            git fetch origin main
            git reset --hard origin/main

            python scripts/fetch_all_profiles.py

            git add data/artists.json
            if git diff --cached --quiet; then
              echo "No profile changes to commit."
              exit 0
            fi

            git commit -m "chore: bulk update X profiles [$FETCH_MODE]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another update; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "Failed to push profile updates after 3 attempts."
          exit 1
