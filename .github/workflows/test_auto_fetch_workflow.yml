name: Test auto profile fetch workflow

on:
  pull_request:
    paths:
      - '.github/workflows/fetch_all_profiles.yml'
      - 'tests/test_auto_fetch_workflow.py'
      - '.github/workflows/test_auto_fetch_workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m pytest -q tests/test_auto_fetch_workflow.py
