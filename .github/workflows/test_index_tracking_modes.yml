name: Test index tracking modes

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/test_index_tracking_modes.py'
      - '.github/workflows/test_index_tracking_modes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tracking mode tests
        run: python -m pytest -q tests/test_index_tracking_modes.py
