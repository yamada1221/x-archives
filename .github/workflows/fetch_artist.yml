name: Fetch Artist Profile

on:
  repository_dispatch:
    types: [fetch_artist]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install twscrape requests

      - name: Fetch artist profile
        env:
          ARTIST_ID: ${{ github.event.client_payload.artist_id }}
          X_ACCOUNT: ${{ github.event.client_payload.x_account }}
        run: python scripts/fetch_artist.py

      - name: Commit updated artists.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/artists.json
          git diff --cached --quiet || git commit -m "chore: update artist profile [${{ github.event.client_payload.x_account }}]"
          git push
