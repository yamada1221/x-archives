name: Test Threads profile fetch

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'scripts/fetch_threads.py'
      - 'scripts/refresh_threads_profiles.py'
      - 'tests/test_fetch_threads.py'
      - 'tests/test_refresh_threads_profiles.py'
      - 'index.html'
      - '.github/workflows/test_threads.yml'
  pull_request:
    paths:
      - 'scripts/fetch_threads.py'
      - 'scripts/refresh_threads_profiles.py'
      - 'tests/test_fetch_threads.py'
      - 'tests/test_refresh_threads_profiles.py'
      - 'index.html'
      - '.github/workflows/test_threads.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI test dependency
        run: python -m pip install --upgrade pytest
      - name: Run Threads profile tests
        run: python -m unittest -v tests.test_fetch_threads tests.test_refresh_threads_profiles
      - name: Run existing index tests
        run: python -m pytest -q tests/test_index_tracking_modes.py
      - name: Check index JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].rsplit("</script>", 1)[0]
          Path("/tmp/x-archives-index.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/x-archives-index.js
      - name: Probe Threads share URL directly
        run: |
          set +e
          python - <<'PY'
          import re
          import urllib.request
          url = "https://www.threads.com/share/BAeGfI7t6P/"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read(2 * 1024 * 1024).decode("utf-8", "replace")
                  print("urllib_status=", response.status)
                  print("urllib_final=", response.geturl())
                  for pattern in [
                      r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"',
                      r'<meta[^>]+property="og:url"[^>]+content="([^"]+)"',
                      r'https://www\.threads\.com/@[A-Za-z0-9._]+/post/[A-Za-z0-9_-]+',
                  ]:
                      match = re.search(pattern, raw, re.I)
                      print("urllib_match=", match.group(1) if match and match.lastindex else (match.group(0) if match else ""))
          except Exception as exc:
              print("urllib_error=", type(exc).__name__, str(exc))
          PY

          command -v google-chrome || command -v chromium || command -v chromium-browser
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom               "https://www.threads.com/share/BAeGfI7t6P/" > /tmp/threads-share.html 2>/tmp/chrome.err
            python - <<'PY'
          import re
          from pathlib import Path
          raw = Path("/tmp/threads-share.html").read_text(encoding="utf-8", errors="replace")
          print("chrome_bytes=", len(raw))
          for pattern in [
              r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"',
              r'<meta[^>]+property="og:url"[^>]+content="([^"]+)"',
              r'https://www\.threads\.com/@[A-Za-z0-9._]+/post/[A-Za-z0-9_-]+',
          ]:
              match = re.search(pattern, raw, re.I)
              print("chrome_match=", match.group(1) if match and match.lastindex else (match.group(0) if match else ""))
          PY
          fi
          exit 0
