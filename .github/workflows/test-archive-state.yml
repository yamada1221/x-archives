name: Test archive state

on:
  pull_request:
    paths:
      - 'scripts/archive_state.py'
      - 'tests/test_archive_state.py'
      - '.github/workflows/test-archive-state.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run archive state tests
        run: python -m pytest -q tests/test_archive_state.py
