name: Monitor X accounts

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: x-archives-data-writes
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check, commit, and push account states
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Attempt $attempt: sync with latest main"
            git fetch origin main
            git reset --hard origin/main

            python scripts/monitor_accounts.py

            git add data/artists.json
            if git diff --cached --quiet; then
              echo "No account state changes to commit."
              exit 0
            fi

            git commit -m "chore: record X account checks"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another update; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "Failed to push account state updates after 3 attempts."
          exit 1
