name: Apply archive status UI

on:
  push:
    branches:
      - feature/archive-status-ui
    paths:
      - '.github/workflows/apply-archive-status-ui.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-archive-status-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archive-status-ui
      - name: Patch tracker UI and tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_old = "  .status-tag.pending { background: #fff8e1; color: #9a6700; }"
          css_new = css_old + "\n  .status-tag.archive-missing { background: #f5f5f3; color: #666; }\n  .status-tag.archive-done { background: #e8f5e9; color: #2e7d32; }"
          if css_old not in text:
              raise SystemExit('status CSS anchor not found')
          text = text.replace(css_old, css_new, 1)

          fn_anchor = "function archiveHelperUrl(artist) {\n  return `archive_helper.html?x=${encodeURIComponent(artist.x_account || '')}`;\n}\n"
          fn_insert = fn_anchor + "\nfunction archiveBadge(artist) {\n  if (artist.tracking_mode !== 'record') return '';\n  if (artist.archive_status === 'done' && artist.archive_url) return '<span class=\"status-tag archive-done\">保存済み</span>';\n  if (artist.archive_status === 'pending') return '<span class=\"status-tag pending\">処理中</span>';\n  return '<span class=\"status-tag archive-missing\">未保存</span>';\n}\n"
          if fn_anchor not in text:
              raise SystemExit('archiveHelperUrl anchor not found')
          text = text.replace(fn_anchor, fn_insert, 1)

          meta_old = "          ${fetchBadge(artist)}\n          ${monitorBadge(artist)}\n          <span class=\"chevron\" id=\"chev_${esc(artist.id)}\">▾</span>"
          meta_new = "          ${fetchBadge(artist)}\n          ${monitorBadge(artist)}\n          ${archiveBadge(artist)}\n          <span class=\"chevron\" id=\"chev_${esc(artist.id)}\">▾</span>"
          if meta_old not in text:
              raise SystemExit('artist meta anchor not found')
          text = text.replace(meta_old, meta_new, 1)

          archive_old = "        ${artist.archive && artist.archive.url ? `\n          <div class=\"row\" style=\"margin-bottom:.75rem\">\n            <a href=\"${esc(artist.archive.url)}\" target=\"_blank\" rel=\"noopener\"><button class=\"small\">保存済みarchiveを見る</button></a>\n          </div>` : ''}"
          archive_new = "        ${artist.archive_status === 'done' && artist.archive_url ? `\n          <div class=\"row\" style=\"margin-bottom:.75rem\">\n            <a href=\"${esc(artist.archive_url)}\" target=\"_blank\" rel=\"noopener\"><button class=\"small\">保存済みarchiveを見る</button></a>\n          </div>` : ''}"
          if archive_old not in text:
              raise SystemExit('legacy archive link anchor not found')
          text = text.replace(archive_old, archive_new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_index_tracking_modes.py')
          tests = test_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_record_archive_status_badges_are_rendered():\n    assert "function archiveBadge(artist)" in HTML\n    assert "保存済み" in HTML\n    assert "処理中" in HTML\n    assert "未保存" in HTML\n    assert "${archiveBadge(artist)}" in HTML\n\n\ndef test_saved_archive_link_uses_current_archive_fields():\n    assert "artist.archive_status === 'done' && artist.archive_url" in HTML\n    assert "href=\\\"${esc(artist.archive_url)}\\\"" in HTML\n    assert "artist.archive && artist.archive.url" not in HTML\n'''
          if 'test_record_archive_status_badges_are_rendered' not in tests:
              test_path.write_text(tests.rstrip() + addition + '\n', encoding='utf-8')
      - name: Run tracker tests
        run: python -m pytest -q tests/test_index_tracking_modes.py
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-archive-status-ui.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html tests/test_index_tracking_modes.py .github/workflows/apply-archive-status-ui.yml
          git commit -m "feat: show archive status in tracker"
          git push
