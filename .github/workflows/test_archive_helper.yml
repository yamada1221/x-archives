name: Test archive helper

on:
  pull_request:
    paths:
      - 'archive_helper.html'
      - 'tests/test_archive_helper.py'
      - '.github/workflows/test_archive_helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run archive helper tests
        run: python -m pytest -q tests/test_archive_helper.py
