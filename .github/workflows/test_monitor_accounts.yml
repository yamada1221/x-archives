name: Test monitor accounts

on:
  pull_request:
    paths:
      - 'scripts/monitor_accounts.py'
      - 'tests/test_monitor_accounts.py'
      - '.github/workflows/monitor_accounts.yml'
      - '.github/workflows/test_monitor_accounts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run monitor account tests
        run: python -m unittest -v tests/test_monitor_accounts.py
